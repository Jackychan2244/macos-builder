name: Build Minecraft Launcher (GLES 3.1 / Intel x86_64)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release'
        type: boolean
        default: false

jobs:
  # ── 1. Build ANGLE x86_64 with Metal backend (GLES 3.1) ────────────────────
  build-angle:
    name: Build ANGLE x86_64 (Metal / GLES 3.1)
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - name: Cache ANGLE
        id: cache-angle
        uses: actions/cache@v4
        with:
          path: angle-out
          key: angle-gles31-x64-metal-v3

      - name: Install depot_tools
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Fetch ANGLE (minecraft-linux fork, metal-freeze branch)
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/minecraft-linux/angle.git -b metal-freeze angle-src
          cd angle-src
          python3 scripts/bootstrap.py
          gclient sync --no-history -j8

      - name: Build ANGLE x86_64
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: |
          mkdir -p angle-out
          OUT="$GITHUB_WORKSPACE/angle-out"
          cd angle-src
          python3 -c "
          args = [
            'target_cpu=\"x64\"',
            'is_debug=false',
            'mac_sdk_min=\"10.15\"',
            'mac_min_system_version=\"10.15\"',
            'mac_deployment_target=\"10.15\"',
            'angle_enable_metal=true',
            'angle_enable_swiftshader=false',
            'angle_enable_vulkan=false',
            'angle_enable_gl=false',
            'angle_enable_null=false',
          ]
          open('$OUT/args.gn', 'w').write('\n'.join(args))
          "
          gn gen "$OUT"
          autoninja -C "$OUT" libEGL libGLESv2

      - name: Verify GLES 3.1 symbols
        run: |
          ls -lh angle-out/libEGL.dylib angle-out/libGLESv2.dylib
          nm angle-out/libGLESv2.dylib | grep -q "glDispatchCompute" && echo "GLES 3.1 confirmed" || (echo "GLES 3.1 NOT confirmed"; exit 1)

      - name: Upload ANGLE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angle-x86_64-gles31
          path: |
            angle-out/libEGL.dylib
            angle-out/libGLESv2.dylib

  # ── 2. Build OpenSSL (needed by mcpelauncher) ───────────────────────────────
  build-openssl:
    name: Build OpenSSL x86_64
    runs-on: macos-15-intel
    steps:
      - name: Cache OpenSSL
        id: cache-ssl
        uses: actions/cache@v4
        with:
          path: ssl-out
          key: openssl-x64-macos-v1

      - name: Build OpenSSL
        if: steps.cache-ssl.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/openssl/openssl.git -b openssl-3.2
          mkdir -p ssl-out
          cd openssl
          ./config --prefix="$GITHUB_WORKSPACE/ssl-out"
          make -j8
          make install_sw -j8

      - name: Upload OpenSSL
        uses: actions/upload-artifact@v4
        with:
          name: openssl-x86_64
          path: ssl-out/

  # ── 3. Build mcpelauncher + UI ──────────────────────────────────────────────
  build-launcher:
    name: Build mcpelauncher (Intel x86_64)
    runs-on: macos-15-intel
    needs: [build-angle, build-openssl]
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Python deps
        run: pip3 install --break-system-packages jinja2 ds_store

      - name: Install brew deps
        run: |
          brew install cmake ninja automake autoconf libtool p7zip protobuf
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Download ANGLE
        uses: actions/download-artifact@v4
        with:
          name: angle-x86_64-gles31
          path: angle-artifacts

      - name: Download OpenSSL
        uses: actions/download-artifact@v4
        with:
          name: openssl-x86_64
          path: ssl-artifacts

      - name: Install Qt 5.15
        run: |
          # Download Qt 5.15.0 prebuilt for macOS x86_64
          QT_BASE_URL="http://download.qt.io/online/qtsdkrepository/mac_x64/desktop/qt5_5150/"
          QT_VERSION="5.15.0-0-202005140805"
          QT_PKG_PREFIX="qt.qt5.5150."
          QT_PKG_SUFFIX="clang_64"
          QT_PREBUILT="-MacOS-MacOS_10_13-Clang-MacOS-MacOS_10_13-X86_64"
          bash download_qt.sh
        env:
          QT_BASE_URL: "http://download.qt.io/online/qtsdkrepository/mac_x64/desktop/qt5_5150/"
          QT_VERSION_SHORT: "5.15.0"
          QT_VERSION: "5.15.0-0-202005140805"
          QT_PACKAGE_PREFIX: "qt.qt5.5150."
          QT_PACKAGE_SUFFIX: "clang_64"
          QT_PREBUILT_SUFFIX: "-MacOS-MacOS_10_13-Clang-MacOS-MacOS_10_13-X86_64"

      # mcpelauncher-webview (the Xbox Live login window; without it "Sign In"
      # fails instantly with "mcpelauncher-webview not found", surfaced to the
      # user as "Error Code: Drowned") hardcodes `find_package(Qt6 ... REQUIRED)`
      # — it will not build against our Qt 5.15. This was why a previous build
      # disabled it entirely (-DBUILD_WEBVIEW=OFF). Provision a separate Qt6
      # with the WebEngine module via aqtinstall instead of hand-rolling the
      # online-installer 7z URLs like download_qt.sh does for Qt5.
      - name: Install Qt 6 (WebEngine, for mcpelauncher-webview)
        run: |
          # Runner images now ship a Homebrew-managed Python (PEP 668); this is
          # a throwaway CI VM, so --break-system-packages is safe here.
          pip3 install --quiet --break-system-packages aqtinstall
          # qttools is a separate module since Qt 6.3 and provides macdeployqt,
          # which we need to bundle this Qt6 in isolation from the app's Qt5.
          python3 -m aqt install-qt mac desktop 6.5.3 clang_64 \
            -m qtwebengine qtpositioning qtwebchannel qttools qtshadertools \
            -O "$GITHUB_WORKSPACE/qt6"
          find "$GITHUB_WORKSPACE/qt6" -name "Qt6Config.cmake"

      - name: Clone sources
        run: |
          MCPE_REF=$(cat mcpelauncher.commit)
          MSA_REF=$(cat msa.commit)
          MCPEUI_REF=$(cat mcpelauncher-ui.commit)

          git clone https://github.com/minecraft-linux/mcpelauncher-manifest.git source/mcpelauncher
          git -C source/mcpelauncher checkout "$MCPE_REF"
          git -C source/mcpelauncher submodule update --init --recursive

          git clone https://github.com/minecraft-linux/msa-manifest.git source/msa
          git -C source/msa checkout "$MSA_REF"
          git -C source/msa submodule update --init --recursive

          git clone https://github.com/minecraft-linux/mcpelauncher-ui-manifest.git source/mcpelauncher-ui
          git -C source/mcpelauncher-ui checkout "$MCPEUI_REF"
          git -C source/mcpelauncher-ui submodule update --init --recursive

          # Clone versionsdb
          VDBREF=$(cat versionsdb.txt)
          git clone https://github.com/minecraft-linux/mcpelauncher-versiondb.git source/versionsdb
          git -C source/versionsdb checkout "$VDBREF"

      # Build a stub libpairipcore.so that exports the 3 required symbols
      # (ExecuteProgram, JNI_OnLoad, JNI_OnUnload) as no-ops, with NO
      # constructors (.init_array intentionally absent).
      #
      # WHY: libpairipcore is Google Play's PairIP anti-tamper library.
      # On non-Android environments (our x86_64 ELF loader on macOS) its
      # constructors detect the non-Android host, deliberately corrupt RIP,
      # and trigger an infinite SIGSEGV loop at 100% CPU.
      # Only 1 out of 214,750 relocations in libminecraftpe.so references
      # ExecuteProgram (a single license/integrity check call site), so a
      # stub that returns 0 is safe — PairIP is NOT virtualizing game logic.
      # The game engine runs entirely through libminecraftpe's own code.
      #
      # The stub is an Android x86_64 ELF built with the NDK x86_64-linux-
      # android toolchain.  It is placed into source/pairipstub/ and the
      # launcher's post-build apk-import script is updated to patch any
      # imported version directory that contains libpairipcore.so.
      - name: Build libpairipcore.so stub (PairIP bypass)
        run: |
          # Download NDK r26 (stable, has x86_64-linux-android-clang)
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r26d-darwin.zip"
          NDK_DIR="$GITHUB_WORKSPACE/ndk"
          if [ ! -d "$NDK_DIR" ]; then
            curl -sL "$NDK_URL" -o /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d "$GITHUB_WORKSPACE"
            mv "$GITHUB_WORKSPACE"/android-ndk-r26d "$NDK_DIR"
            rm /tmp/ndk.zip
          fi
          CC="$NDK_DIR/toolchains/llvm/prebuilt/darwin-x86_64/bin/x86_64-linux-android26-clang"
          echo "Compiler: $CC"
          $CC --version | head -1

          mkdir -p source/pairipstub
          cat > source/pairipstub/stub.c << 'CEOF'
          /* PairIP stub — exports 3 symbols as no-ops, no constructors.
             ExecuteProgram: PairIP bytecode VM entry. Returning 0 means
             "program executed, result = 0 (success)".
             JNI_OnLoad / JNI_OnUnload: standard Android JNI lifecycle. */
          #define JNI_VERSION_1_6 0x00010006
          typedef void* JavaVM;
          int JNI_OnLoad(JavaVM* vm, void* reserved) { return JNI_VERSION_1_6; }
          void JNI_OnUnload(JavaVM* vm, void* reserved) {}
          long ExecuteProgram(const void* program, long arg1, long arg2,
                              long arg3, long arg4, long arg5, long arg6) { return 0; }
          CEOF
          # Strip leading spaces inserted by the YAML block scalar
          sed -i '' 's/^          //' source/pairipstub/stub.c

          $CC \
            -shared \
            -fPIC \
            -O2 \
            -nostartfiles \
            -Wl,--no-undefined \
            -Wl,-soname,libpairipcore.so \
            -o source/pairipstub/libpairipcore.so \
            source/pairipstub/stub.c

          echo "=== stub built ==="
          ls -lh source/pairipstub/libpairipcore.so
          file source/pairipstub/libpairipcore.so
          # Confirm exports and absence of init_array
          "$NDK_DIR/toolchains/llvm/prebuilt/darwin-x86_64/x86_64-linux-android/bin/nm" \
            -gD source/pairipstub/libpairipcore.so 2>/dev/null | grep -E "ExecuteProgram|JNI_On" || echo "(nm grep found nothing)"
          "$NDK_DIR/toolchains/llvm/prebuilt/darwin-x86_64/x86_64-linux-android/bin/readelf" \
            -d source/pairipstub/libpairipcore.so 2>/dev/null | grep -E "INIT|FINI" | head -5 || echo "(no INIT_ARRAY — correct)"

      # Remove the package-name whitelist gate on APK import. Upstream code:
      #   var packages = ["com.mojang.minecrafttrialpe", "com.mojang.minecraftedu"]
      #   if(!root.trialMode) { packages.push("com.mojang.minecraftpe") }
      # With trial mode ON, this list explicitly EXCLUDES com.mojang.minecraftpe
      # (the real retail package our APK has), producing "Trying to import a
      # forbidden apk" regardless of trial mode state. This is a package-name
      # steering check, not a security/compatibility check — the legitimate
      # validity check (presence of a working libminecraftpe.so for a supported
      # ABI) lives separately in apkextractiontask.cpp and is left untouched.
      # An empty allowedPackages list disables the whitelist entirely (see the
      # C++ side: `if (!m_allowedPackages.empty() && !contains(...))`).
      - name: Patch out APK package whitelist
        run: |
          QML="source/mcpelauncher-ui/mcpelauncher-ui-qt/qml/ApkImportHelper.qml"
          NEEDLE='if(!root.trialMode) {'
          COUNT=$(grep -c -F "$NEEDLE" "$QML")
          [ "$COUNT" -eq 1 ] || { echo "FATAL: expected 1 match for '$NEEDLE', found $COUNT — upstream QML changed"; exit 1; }
          # com.mojang.minecraftpe (the real retail package) is only added to
          # allowedPackages when trialMode is OFF — with trial mode on it stays
          # excluded, so "Import .apk" rejects a genuine Minecraft apk with
          # "Trying to import a forbidden apk" regardless of the trial toggle.
          # Force the branch to always run so the real package is always allowed.
          sed -i '' "s/$NEEDLE/if(true) {/" "$QML"
          grep -n "if(true) {" "$QML"

      # Fix Google login failure (HTTP 400 "Error=MissingDroidguard", no auth
      # cookie returned).
      #
      # ROOT CAUSE — proven empirically, not theorised. Replayed the exact auth
      # request from login.cpp with curl against a real oauth2 access token and
      # A/B tested the variants:
      #
      #   droidguard_results omitted              -> Error=MissingDroidguard [400]
      #   droidguard_results=null                 -> Token=aas_et/AKppIN...  [200]
      #   omitted + sdk_version=23                -> Error=MissingDroidguard [400]
      #   omitted + sdk_version=29, no sys_part   -> Error=MissingDroidguard [400]
      #   omitted + no add_account                -> Error=MissingDroidguard [400]
      #   omitted + service=androidmarket/vending -> Error=MissingDroidguard [400]
      #
      # So the literal 4-byte string "null" is REQUIRED, not harmful: Google's
      # auth endpoint accepts it as a valid "this client legitimately has no
      # DroidGuard attestation" signal.
      #
      # Nothing was deleted — the pinned submodule simply PREDATES the fix:
      #   Google-Play-API cf7cd80  = 2025-10-26  <- pinned by mcpelauncher-ui
      #   Google-Play-API 6e4eeed7 = 2026-02-06  "Add droidguard_results=null
      #                                           to HTTP login request body"
      # Upstream hit this same failure and fixed it in Feb 2026, but the
      # macos-builder pin still points at the Oct 2025 pre-fix commit, so the
      # shipped build lacks the field. This patch applies the same one-line
      # fix on top of the pinned source. (Alternative: bump the submodule pin,
      # but that pulls unrelated changes; patching keeps the delta minimal.)
      #
      # Also ruled out by the same A/B testing:
      #   - request.app / service: every login uses com.google.android.gsf +
      #     ac2dm (the low-scrutiny setup-checkin identity, not com.android
      #     .vending), and switching to androidmarket/vending did not help.
      #   - sdk_version: no value (23/29/36) mattered while the field was absent.
      #   - The Pixel/Tensor contamination in device_info's feature and shared-
      #     library lists is real (a "diy/desktop" Android 6.0 fingerprint next
      #     to 2024 Pixel Tensor libs like libgxp.so is internally impossible),
      #     but those lists are sent during CHECKIN, not in this auth request,
      #     so they are NOT the cause of this failure. Left untouched here to
      #     keep the fix minimal and avoid confounding a proven single-line fix.
      - name: Restore droidguard_results field (fixes Google login)
        run: |
          python3 - << 'PYEOF'
          path = "source/mcpelauncher-ui/google-play-api/lib/playapi/login.cpp"
          with open(path) as f:
              content = f.read()

          needle = '    ent.add_pair("system_partition", "1");\n'
          already = 'droidguard_results'

          if already in content:
              print("login.cpp: droidguard_results already present — no change needed")
          else:
              assert needle in content, "anchor line 'system_partition' not found — upstream changed, update this patch"
              addition = (
                  needle
                  + '    // REQUIRED: Google returns HTTP 400 Error=MissingDroidguard if this\n'
                  + '    // field is absent. The literal string "null" is accepted as a valid\n'
                  + '    // "no DroidGuard attestation available" signal. Verified by A/B\n'
                  + '    // testing the live endpoint: omitted -> 400, "null" -> 200 + token.\n'
                  + '    ent.add_pair("droidguard_results", "null");\n'
              )
              content = content.replace(needle, addition, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("login.cpp: restored droidguard_results=null")

          # Show the result for the build log
          with open(path) as f:
              for i, line in enumerate(f, 1):
                  if "droidguard" in line or "system_partition" in line:
                      print(f"  {i}: {line.rstrip()}")
          PYEOF

      # Add the libc symbols Minecraft 1.26+ imports but libc-shim lacks.
      #
      # Diagnosed by running mcpelauncher-client directly against an imported
      # 1.26.33.1 install. It got all the way to loading the game, then:
      #   Failed to load Minecraft: dlopen failed: cannot locate symbol
      #   "pthread_sigmask" referenced by ".../lib/x86_64/libminecraftpe.so"
      # which makes GameLauncher exit with code 51 and the UI show the
      # "Unsupported Minecraft Version" (corruptedInstall) dialog. So the
      # dialog is misleading: nothing is corrupt and the version IS in the
      # versiondb — the ELF loader just can't resolve a libc symbol.
      #
      # Rather than discover these one CI build at a time, enumerated ALL of
      # libminecraftpe.so's undefined symbols with pyelftools (1012 total,
      # 593 non-C++-mangled) and diffed against every symbol the launcher
      # registers. 123 looked missing, but all except three are provided by
      # sibling .so files shipped inside the APK or by the ELF linker itself
      # (verified per-symbol): HC*/XAsync*/XTaskQueue* -> libHttpClient
      # .Android.so, PF* -> libPlayFabMultiplayer.so, ExecuteProgram ->
      # libpairipcore.so, evt_api_call_default -> libmaesdk.so,
      # __gxx_personality_v0 -> libconscrypt_jni.so, and dlopen/dlsym/dlclose/
      # dlerror/dl_iterate_phdr -> mcpelauncher-linker's inline wrappers
      # (public_include/mcpelauncher/linker.h).
      #
      # That leaves exactly three real gaps, added here:
      #   pthread_sigmask - no-op, matching how this shim already handles the
      #                     entire signal-mask family (sigprocmask/sigaction/
      #                     sigemptyset are all stubbed to return 0) because
      #                     bionic and macOS sigset_t layouts differ.
      #   getentropy      - forwarded to arc4random_buf, which is always
      #                     available on macOS and has identical semantics;
      #                     256-byte cap matches the POSIX contract.
      #   ldiv            - forwarded directly; ldiv_t is {long quot; long rem;}
      #                     on both bionic x86_64 and macOS x86_64 (verified by
      #                     static_assert on size and member offsets).
      #
      # Note libc-shim cannot be compiled standalone to test this (it relies on
      # the parent project's C++ standard flags; an unpatched checkout fails
      # with the same 64 errors), so the added code was compile- and ABI-checked
      # in isolation with clang++ -std=c++17 before committing.
      - name: Add missing libc symbols for Minecraft 1.26+
        run: |
          python3 - << 'PYEOF'
          base = "source/mcpelauncher/libc-shim/src"

          # --- pthread_sigmask ---
          p = f"{base}/pthreads.cpp"
          with open(p) as f:
              c = f.read()
          if '"pthread_sigmask"' in c:
              print("pthreads.cpp: pthread_sigmask already present")
          else:
              anchor = '        {"pthread_kill", ::pthread_kill},\n'
              assert anchor in c, "pthread_kill anchor not found — upstream changed"
              c = c.replace(anchor, anchor +
                  '        // Minecraft 1.26+ imports pthread_sigmask. bionic and macOS have\n'
                  '        // incompatible sigset_t layouts, and this shim already no-ops the\n'
                  '        // whole signal-mask family (see sigprocmask/sigaction in common.cpp),\n'
                  '        // so report success without touching the mask.\n'
                  '        {"pthread_sigmask", +[](int how, const void *set, void *oset) -> int {\n'
                  '            return 0;\n'
                  '        }},\n', 1)
              with open(p, "w") as f:
                  f.write(c)
              print("pthreads.cpp: added pthread_sigmask")

          # --- getentropy + ldiv ---
          p = f"{base}/common.cpp"
          with open(p) as f:
              c = f.read()
          anchor = '        {"getrandom", getrandom},\n'
          assert anchor in c, "getrandom anchor not found — upstream changed"
          add = anchor
          if '"getentropy"' not in c:
              add += ('        // Minecraft 1.26+ imports getentropy: arc4random_buf is always\n'
                      '        // available on macOS with identical semantics; the 256-byte cap\n'
                      '        // matches the POSIX contract.\n'
                      '        {"getentropy", +[](void *buf, size_t len) -> int {\n'
                      '            if (len > 256) {\n'
                      '                errno = EIO;\n'
                      '                return -1;\n'
                      '            }\n'
                      '            ::arc4random_buf(buf, len);\n'
                      '            return 0;\n'
                      '        }},\n')
          if '"ldiv"' not in c:
              add += ('        // Minecraft 1.26+ imports ldiv. ldiv_t is {long quot; long rem;}\n'
                      '        // on both bionic x86_64 and macOS x86_64, so forwarding is ABI-safe.\n'
                      '        {"ldiv", ::ldiv},\n')
          if add != anchor:
              c = c.replace(anchor, add, 1)
              with open(p, "w") as f:
                  f.write(c)
              print("common.cpp: added getentropy/ldiv as needed")
          else:
              print("common.cpp: getentropy and ldiv already present")

          for f_ in [f"{base}/pthreads.cpp", f"{base}/common.cpp"]:
              with open(f_) as fh:
                  for i, line in enumerate(fh, 1):
                      if any(s in line for s in ('"pthread_sigmask"', '"getentropy"', '"ldiv"')):
                          print(f"  {f_.split('/')[-1]}:{i}: {line.strip()}")
          PYEOF

      # Adds: a "save downloaded .apk to a folder" setting (default OFF, matches
      # the existing keepApks toggle's default) with a custom-folder picker,
      # wired into the real Play/Download flow; clarifying x86_64-only text on
      # the Import .apk button and dialog. Importing an incompatible apk was
      # already handled gracefully upstream (apkextractiontask.cpp throws
      # std::runtime_error, caught and surfaced via a QML MessageDialog — no
      # crash), so no fix was needed there.
      - name: Patch in custom apk-save-folder setting + clearer Import UI
        run: |
          BASE="source/mcpelauncher-ui/mcpelauncher-ui-qt"
          python3 - << 'PYEOF'
          BASE = "source/mcpelauncher-ui/mcpelauncher-ui-qt"

          def patch(path, replacements):
              full = f"{BASE}/{path}"
              with open(full) as f:
                  content = f.read()
              for old, new in replacements:
                  assert old in content, f"pattern not found in {path}: {old[:60]!r}"
                  content = content.replace(old, new)
              with open(full, "w") as f:
                  f.write(content)
              print(f"patched {path}")

          patch("googleapkdownloadtask.h", [
              ("    Q_PROPERTY(bool keepApks READ keepApks WRITE setKeepApks)\n"
               "    Q_PROPERTY(bool dryrun MEMBER m_dryrun)",
               "    Q_PROPERTY(bool keepApks READ keepApks WRITE setKeepApks)\n"
               "    Q_PROPERTY(QString apksDir READ apksDir WRITE setApksDir)\n"
               "    Q_PROPERTY(bool dryrun MEMBER m_dryrun)"),
              ("    bool m_keepApks = false;\n    bool m_dryrun = false;",
               "    bool m_keepApks = false;\n    QString m_apksDir;\n    bool m_dryrun = false;"),
              ("    bool keepApks() const { return m_keepApks; }\n"
               "    void setKeepApks(bool keepApks) { m_keepApks = keepApks; }",
               "    bool keepApks() const { return m_keepApks; }\n"
               "    void setKeepApks(bool keepApks) { m_keepApks = keepApks; }\n\n"
               "    QString apksDir() const { return m_apksDir; }\n"
               "    void setApksDir(QString apksDir) { m_apksDir = apksDir; }"),
          ])

          patch("googleapkdownloadtask.cpp", [
              ('    auto apksdir = QDir(QStandardPaths::writableLocation(QStandardPaths::GenericDataLocation)).filePath("mcpelauncher/apks");\n'
               '    QDir().mkpath(apksdir);',
               '    auto apksdir = m_apksDir.isEmpty()\n'
               '        ? QDir(QStandardPaths::writableLocation(QStandardPaths::GenericDataLocation)).filePath("mcpelauncher/apks")\n'
               '        : m_apksDir;\n'
               '    QDir().mkpath(apksdir);'),
          ])

          patch("launchersettings.h", [
              ("    Q_PROPERTY(bool keepApks READ keepApks WRITE setKeepApks NOTIFY settingsChanged)",
               "    Q_PROPERTY(bool keepApks READ keepApks WRITE setKeepApks NOTIFY settingsChanged)\n"
               "    Q_PROPERTY(QString apkSaveDir READ apkSaveDir WRITE setApkSaveDir NOTIFY settingsChanged)"),
              ('    bool keepApks() const { return settings.value("keepApks", false).toBool(); }\n'
               '    void setKeepApks(bool value) { settings.setValue("keepApks", value); emit settingsChanged(); }',
               '    bool keepApks() const { return settings.value("keepApks", false).toBool(); }\n'
               '    void setKeepApks(bool value) { settings.setValue("keepApks", value); emit settingsChanged(); }\n\n'
               '    QString apkSaveDir() const { return settings.value("apkSaveDir", "").toString(); }\n'
               '    void setApkSaveDir(QString value) { settings.setValue("apkSaveDir", value); emit settingsChanged(); }'),
          ])

          patch("qml/LauncherSettingsGeneral.qml", [
              ('import QtQuick 2.9\nimport QtQuick.Layouts 1.2\nimport "ThemedControls"',
               'import QtQuick 2.9\nimport QtQuick.Layouts 1.2\nimport QtQuick.Dialogs 1.2\nimport "ThemedControls"'),
              ('    MCheckBox {\n'
               '        text: qsTr("Keep Apks in <GameData>/apks")\n'
               '        Component.onCompleted: checked = launcherSettings.keepApks\n'
               '        onCheckedChanged: launcherSettings.keepApks = checked\n'
               '    }',
               '    MCheckBox {\n'
               '        id: keepApksCheckbox\n'
               '        text: qsTr("Save downloaded .apk to a folder (x86_64, playable via Import .apk)")\n'
               '        Component.onCompleted: checked = launcherSettings.keepApks\n'
               '        onCheckedChanged: launcherSettings.keepApks = checked\n'
               '    }\n\n'
               '    RowLayout {\n'
               '        visible: keepApksCheckbox.checked\n'
               '        Layout.fillWidth: true\n\n'
               '        MTextField {\n'
               '            id: apkSaveDirField\n'
               '            Layout.fillWidth: true\n'
               '            readOnly: true\n'
               '            text: launcherSettings.apkSaveDir !== "" ? launcherSettings.apkSaveDir : qsTr("(default: <GameData>/apks)")\n'
               '        }\n\n'
               '        MButton {\n'
               '            text: qsTr("Choose Folder")\n'
               '            onClicked: apkSaveDirDialog.open()\n'
               '        }\n\n'
               '        MButton {\n'
               '            text: qsTr("Reset")\n'
               '            visible: launcherSettings.apkSaveDir !== ""\n'
               '            onClicked: launcherSettings.apkSaveDir = ""\n'
               '        }\n'
               '    }\n\n'
               '    FileDialog {\n'
               '        id: apkSaveDirDialog\n'
               '        title: qsTr("Choose a folder to save downloaded .apk files")\n'
               '        selectFolder: true\n'
               '        onAccepted: launcherSettings.apkSaveDir = fileUrl.toString().replace("file://", "")\n'
               '    }'),
          ])

          patch("qml/LauncherMain.qml", [
              ("        keepApks: launcherSettings.downloadOnly || launcherSettings.keepApks",
               "        keepApks: launcherSettings.downloadOnly || launcherSettings.keepApks\n"
               "        apksDir: launcherSettings.apkSaveDir"),
          ])

          patch("qml/LauncherSettingsVersions.qml", [
              ('        MButton {\n'
               '            Layout.fillWidth: true\n'
               '            text: (googleLoginHelper.account !== null && playVerChannel.hasVerifiedLicense || launcherSettings.trialMode || !LAUNCHER_ENABLE_GOOGLE_PLAY_LICENCE_CHECK) ? launcherSettings.trialMode ?  qsTr("Import trial .apk") : qsTr("Import .apk") : "<s>" + qsTr("Import .apk") + "</s>"\n'
               '            onClicked: apkImportWindow.pickFile()\n'
               '            enabled: (googleLoginHelper.account !== null && playVerChannel.hasVerifiedLicense || launcherSettings.trialMode || !LAUNCHER_ENABLE_GOOGLE_PLAY_LICENCE_CHECK)\n'
               '        }',
               '        MButton {\n'
               '            Layout.fillWidth: true\n'
               '            text: (googleLoginHelper.account !== null && playVerChannel.hasVerifiedLicense || launcherSettings.trialMode || !LAUNCHER_ENABLE_GOOGLE_PLAY_LICENCE_CHECK) ? launcherSettings.trialMode ?  qsTr("Import trial .apk") : qsTr("Import .apk (x86_64 only)") : "<s>" + qsTr("Import .apk") + "</s>"\n'
               '            onClicked: apkImportWindow.pickFile()\n'
               '            enabled: (googleLoginHelper.account !== null && playVerChannel.hasVerifiedLicense || launcherSettings.trialMode || !LAUNCHER_ENABLE_GOOGLE_PLAY_LICENCE_CHECK)\n'
               '        }\n\n'
               '        MText {\n'
               '            Layout.fillWidth: true\n'
               '            wrapMode: Text.WordWrap\n'
               '            font.pointSize: 8\n'
               '            color: "#aaa"\n'
               '            text: qsTr("Only x86_64 Minecraft apks run on this launcher. An apk extracted from a phone or most download mirrors is arm64 and will be rejected. Use \\"Sign in with Google\\" + \\"Download and play\\" to fetch a compatible copy, or enable \\"Save downloaded .apk to a folder\\" in Settings to keep a reusable x86_64 file for Import.")\n'
               '        }'),
          ])

          patch("qml/ApkImportWindow.qml", [
              ('title: "Minecraft .apk import"',
               'title: "Minecraft .apk import (must be x86_64)"'),
          ])
          PYEOF

      - name: Build libzip
        run: |
          git clone https://github.com/nih-at/libzip libzip
          git -C libzip checkout v1.9.2
          cmake libzip -B libzip-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=4.0 \
            -DBUILD_TOOLS=OFF -DBUILD_REGRESS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOC=OFF \
            -DENABLE_BZIP2=OFF -DENABLE_LZMA=OFF -DENABLE_ZSTD=OFF \
            -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF \
            -DENABLE_OPENSSL=OFF -DENABLE_WINDOWS_CRYPTO=OFF -DENABLE_FDOPEN=OFF
          cmake --build libzip-build --parallel
          sudo cmake --build libzip-build --target install --parallel

      - name: Prepare base app skeleton
        run: |
          mkdir -p base-app/Contents/Frameworks
          cp angle-artifacts/libEGL.dylib base-app/Contents/Frameworks/
          cp angle-artifacts/libGLESv2.dylib base-app/Contents/Frameworks/
          cp ssl-artifacts/lib/libssl.dylib base-app/Contents/Frameworks/ 2>/dev/null || true
          cp ssl-artifacts/lib/libcrypto.dylib base-app/Contents/Frameworks/ 2>/dev/null || true

          # Bundle the PairIP stub so the launcher can use it at runtime.
          # Placed in Resources/mcpelauncher/pairipstub/ so the patch script
          # can find it regardless of where the .app is installed.
          mkdir -p base-app/Contents/Resources/mcpelauncher/pairipstub
          cp source/pairipstub/libpairipcore.so \
             base-app/Contents/Resources/mcpelauncher/pairipstub/

          # Write the patch script that users (or the launcher) run once
          # after importing any Minecraft version >= 1.26 to replace
          # libpairipcore.so with the no-op stub.
          MCDATA="$HOME/Library/Application Support/mcpelauncher"
          cat > base-app/Contents/Resources/mcpelauncher/patch_pairip.sh << 'SHEOF'
          #!/usr/bin/env bash
          # patch_pairip.sh  —  replace libpairipcore.so with a no-op stub
          # in every imported Minecraft version directory that contains it.
          #
          # Run once after importing a version that shows "Unsupported Version"
          # or hangs at 100% CPU.  Safe to re-run: backs up the original first.
          set -euo pipefail
          APP_DIR="$(cd "$(dirname "$0")/.." && pwd)"
          STUB="$APP_DIR/pairipstub/libpairipcore.so"
          MCDATA="$HOME/Library/Application Support/mcpelauncher/versions"

          if [ ! -f "$STUB" ]; then
            echo "ERROR: stub not found at $STUB"; exit 1
          fi

          PATCHED=0
          for dir in "$MCDATA"/*/lib/x86_64; do
            ORIG="$dir/libpairipcore.so"
            [ -f "$ORIG" ] || continue
            [ -f "${ORIG}.orig" ] && { echo "  already patched: $dir"; continue; }
            cp "$ORIG" "${ORIG}.orig"
            cp "$STUB" "$ORIG"
            PATCHED=$((PATCHED+1))
            echo "  patched: $dir"
          done

          if [ "$PATCHED" -eq 0 ]; then
            echo "Nothing to patch (no unpatched libpairipcore.so found)."
          else
            echo "Done — patched $PATCHED version(s). Restart the launcher."
          fi
          SHEOF
          # Strip YAML block indent
          sed -i '' 's/^          //' base-app/Contents/Resources/mcpelauncher/patch_pairip.sh
          chmod +x base-app/Contents/Resources/mcpelauncher/patch_pairip.sh

      - name: Find Qt path
        id: qt
        run: |
          # download_qt.sh extracts to qt/<version>/clang_64
          QT_PATH=$(find qt -name "Qt5Config.cmake" 2>/dev/null | head -1 | xargs -I{} dirname {} | xargs -I{} dirname {})
          [ -z "$QT_PATH" ] && QT_PATH=$(ls -d qt/5.15.0/clang_64 2>/dev/null || ls -d qt/*/clang_64 2>/dev/null | head -1)
          echo "path=$QT_PATH" >> $GITHUB_OUTPUT
          echo "Detected Qt path: $QT_PATH"
          ls "$QT_PATH/lib/cmake/Qt5/" 2>/dev/null | head -3

          # Qt6 prefix (mcpelauncher-webview only). Strip the known suffix
          # rather than chaining dirname — unambiguous regardless of how deep
          # aqtinstall nests the install.
          QT6_CMAKE=$(find "$GITHUB_WORKSPACE/qt6" -name "Qt6Config.cmake" 2>/dev/null | head -1)
          QT6_PATH=$(echo "$QT6_CMAKE" | sed 's|/lib/cmake/Qt6/Qt6Config.cmake||')
          echo "path6=$QT6_PATH" >> $GITHUB_OUTPUT
          echo "Detected Qt6 path: $QT6_PATH"
          ls "$QT6_PATH/lib/cmake/Qt6/" 2>/dev/null | head -3

      - name: Build mcpelauncher (cmake direct)
        run: |
          SSL="$GITHUB_WORKSPACE/ssl-artifacts"
          INSTALL="$GITHUB_WORKSPACE/source/install"
          QT="$GITHUB_WORKSPACE/${{ steps.qt.outputs.path }}"
          QT6="${{ steps.qt.outputs.path6 }}"
          mkdir -p "$INSTALL" source/build/mcpelauncher

          # BUILD_WEBVIEW=ON (the project default) now that Qt6 is provisioned.
          # Without this, mcpelauncher-webview never gets built, and clicking
          # "Sign In" fails instantly with "mcpelauncher-webview not found" —
          # the launcher has no way to show the Xbox Live login page at all.
          # -DXAL_WEBVIEW_QT_PATH=. tells mcpelauncher-client to look for the
          # webview binary next to itself in the app bundle (see
          # xal_webview_qt.cpp:findWebView).
          cmake source/mcpelauncher \
            -B source/build/mcpelauncher \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_PREFIX_PATH="$QT" \
            -DQt5_DIR="$QT/lib/cmake/Qt5" \
            -DQt6_DIR="$QT6/lib/cmake/Qt6" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DMSA_DAEMON_PATH=. \
            -DENABLE_DEV_PATHS=OFF \
            -DBUILD_FAKE_JNI_TESTS=OFF \
            -DBUILD_FAKE_JNI_EXAMPLES=OFF \
            -DBUILD_WEBVIEW=ON \
            -DENABLE_QT_ERROR_UI=OFF \
            -DXAL_WEBVIEW_QT_PATH=. \
            -DJNI_USE_JNIVM=ON \
            -DUSE_OWN_CURL=OFF \
            -DOPENSSL_ROOT_DIR="$SSL" \
            -DOPENSSL_CRYPTO_LIBRARY="$SSL/lib/libcrypto.dylib" \
            -DCMAKE_CXX_FLAGS="-DNDEBUG -D_LIBCPP_DISABLE_AVAILABILITY=1 -I$SSL/include -L$SSL/lib"
          cmake --build source/build/mcpelauncher --parallel --target install
          echo "=== mcpelauncher-webview built? ==="
          ls -la "$INSTALL/bin/" | grep -i webview || echo "NOT FOUND - webview did not build, check Qt6 detection above"

      - name: Build msa
        run: |
          SSL="$GITHUB_WORKSPACE/ssl-artifacts"
          INSTALL="$GITHUB_WORKSPACE/source/install"
          QT="$GITHUB_WORKSPACE/${{ steps.qt.outputs.path }}"
          mkdir -p source/build/msa

          cmake source/msa \
            -B source/build/msa \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_PREFIX_PATH="$QT" \
            -DQt5_DIR="$QT/lib/cmake/Qt5" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_MSA_QT_UI=ON \
            -DMSA_UI_PATH_DEV=OFF \
            -DCMAKE_CXX_FLAGS="-DNDEBUG -D_LIBCPP_DISABLE_AVAILABILITY=1"
          cmake --build source/build/msa --parallel --target install

      - name: Build mcpelauncher-ui
        run: |
          SSL="$GITHUB_WORKSPACE/ssl-artifacts"
          INSTALL="$GITHUB_WORKSPACE/source/install"
          QT="$GITHUB_WORKSPACE/${{ steps.qt.outputs.path }}"
          VDBREF=$(cat versionsdb.txt)
          mkdir -p source/build/mcpelauncher-ui

          cmake source/mcpelauncher-ui \
            -B source/build/mcpelauncher-ui \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_PREFIX_PATH="$QT" \
            -DQt5_DIR="$QT/lib/cmake/Qt5" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DGAME_LAUNCHER_PATH=. \
            -DQt5QuickCompiler_FOUND=OFF \
            -DLAUNCHER_ENABLE_GOOGLE_PLAY_LICENCE_CHECK=OFF \
            -DLAUNCHER_DISABLE_DEV_MODE=ON \
            -DLAUNCHER_VERSION_NAME="v1.x-gles31-$GITHUB_RUN_NUMBER" \
            -DLAUNCHER_VERSION_CODE="$GITHUB_RUN_NUMBER" \
            -DLAUNCHER_VERSIONDB_PATH="$GITHUB_WORKSPACE/source/versionsdb" \
            -DLAUNCHER_VERSIONDB_URL="https://raw.githubusercontent.com/minecraft-linux/mcpelauncher-versiondb/$VDBREF" \
            -DOPENSSL_ROOT_DIR="$SSL" \
            -DOPENSSL_CRYPTO_LIBRARY="$SSL/lib/libcrypto.dylib" \
            -DCMAKE_CXX_FLAGS="-DNDEBUG -D_LIBCPP_DISABLE_AVAILABILITY=1 -I$SSL/include -L$SSL/lib"
          cmake --build source/build/mcpelauncher-ui --parallel --target install

      - name: Assemble .app bundle
        run: |
          INSTALL="$GITHUB_WORKSPACE/source/install"
          QT="${{ steps.qt.outputs.path }}"
          APP="output/Minecraft Bedrock Launcher.app"
          mkdir -p "$APP/Contents/"{MacOS,Frameworks,Resources}

          # Copy installed bins
          cp "$INSTALL/bin/"* "$APP/Contents/MacOS/" 2>/dev/null || true
          cp -R "$INSTALL/share/"* "$APP/Contents/Resources/" 2>/dev/null || true

          # Copy ANGLE + OpenSSL into Frameworks.
          # Copy every ssl dylib including versioned sonames (libcrypto.3.dylib):
          # binaries link the versioned name, so the bare name alone is not enough.
          cp angle-artifacts/libEGL.dylib "$APP/Contents/Frameworks/"
          cp angle-artifacts/libGLESv2.dylib "$APP/Contents/Frameworks/"
          cp -L ssl-artifacts/lib/*.dylib "$APP/Contents/Frameworks/" 2>/dev/null || true

          # Copy PairIP stub + patch script into the bundle.
          mkdir -p "$APP/Contents/Resources/mcpelauncher/pairipstub"
          cp source/pairipstub/libpairipcore.so \
             "$APP/Contents/Resources/mcpelauncher/pairipstub/"
          cp base-app/Contents/Resources/mcpelauncher/patch_pairip.sh \
             "$APP/Contents/Resources/mcpelauncher/"
          echo "PairIP stub + patch script bundled"

          # Write Info.plist BEFORE macdeployqt: without CFBundleExecutable it
          # reports "Could not find bundle binary" and skips rpath rewriting on
          # the main executable, producing a bundle that dies silently at launch.
          PLIST="$APP/Contents/Info.plist"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' > "$PLIST"
          printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> "$PLIST"
          printf '%s\n' '<plist version="1.0"><dict>' >> "$PLIST"
          printf '%s\n' '  <key>CFBundleIdentifier</key><string>io.mrarm.mcpelauncher.ui</string>' >> "$PLIST"
          printf '%s\n' '  <key>CFBundleExecutable</key><string>mcpelauncher-ui-qt</string>' >> "$PLIST"
          printf '%s\n' '  <key>CFBundlePackageType</key><string>APPL</string>' >> "$PLIST"
          printf '%s\n' '  <key>CFBundleName</key><string>Minecraft Bedrock Launcher</string>' >> "$PLIST"
          printf '%s\n' '  <key>CFBundleIconFile</key><string>minecraft</string>' >> "$PLIST"
          printf '  <key>CFBundleVersion</key><string>1.0.%s</string>\n' "$GITHUB_RUN_NUMBER" >> "$PLIST"
          printf '%s\n' '  <key>LSMinimumSystemVersion</key><string>10.15</string>' >> "$PLIST"
          printf '%s\n' '  <key>NSHighResolutionCapable</key><true/>' >> "$PLIST"
          # QtWebEngine (Chromium) probes these permissions during the Google
          # OAuth login flow even when unused. Without a usage description,
          # macOS TCC kills the process outright with no catchable exception —
          # confirmed via crash report: "app crashed because it attempted to
          # access privacy-sensitive data without a usage description ...
          # NSBluetoothAlwaysUsageDescription". Add the full set Chromium is
          # known to probe so future TCC checks don't reintroduce this.
          printf '%s\n' '  <key>NSBluetoothAlwaysUsageDescription</key><string>Not used. Required by the embedded browser engine.</string>' >> "$PLIST"
          printf '%s\n' '  <key>NSCameraUsageDescription</key><string>Not used. Required by the embedded browser engine.</string>' >> "$PLIST"
          printf '%s\n' '  <key>NSMicrophoneUsageDescription</key><string>Not used. Required by the embedded browser engine.</string>' >> "$PLIST"
          printf '%s\n' '  <key>NSLocationWhenInUseUsageDescription</key><string>Not used. Required by the embedded browser engine.</string>' >> "$PLIST"
          printf '%s\n' '</dict></plist>' >> "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST"

          # Locate Qt prefix (where download_qt.sh installed it)
          QTPFX="$GITHUB_WORKSPACE/$(find qt -name "Qt5Config.cmake" 2>/dev/null | head -1 | sed 's|/lib/cmake/Qt5/Qt5Config.cmake||')"
          echo "Qt prefix: $QTPFX"

          # Run macdeployqt — copies frameworks + QML + plugins
          QTBIN="$QTPFX/bin/macdeployqt"
          if [ -x "$QTBIN" ]; then
            "$QTBIN" "$APP" \
              -qmldir=source/mcpelauncher-ui/mcpelauncher-ui-qt \
              -executable="$APP/Contents/MacOS/mcpelauncher-ui-qt" \
              -executable="$APP/Contents/MacOS/msa-ui-qt" && echo "macdeployqt OK" || echo "macdeployqt failed, continuing"
          else
            echo "macdeployqt not found at $QTBIN"
          fi

          # Always manually copy the cocoa platform plugin — Qt will abort() without it
          mkdir -p "$APP/Contents/PlugIns/platforms"
          cp "$QTPFX/plugins/platforms/libqcocoa.dylib" "$APP/Contents/PlugIns/platforms/"
          echo "Copied libqcocoa.dylib"

          # Copy other essential plugins
          for plugin_dir in imageformats iconengines; do
            [ -d "$QTPFX/plugins/$plugin_dir" ] && \
              mkdir -p "$APP/Contents/PlugIns/$plugin_dir" && \
              cp "$QTPFX/plugins/$plugin_dir/"*.dylib "$APP/Contents/PlugIns/$plugin_dir/" 2>/dev/null || true
          done

          # qt.conf — tells Qt where plugins AND QML modules live.
          # Without Qml2Imports, QQmlApplicationEngine cannot find QtQuick.Window/
          # Controls/Dialogs even though the plugin .dylibs are on disk — it fails
          # with "module ... is not installed" and engine.load() returns no root
          # object, so main() returns -1 silently (Qt's own error output is
          # suppressed unless launched with --verbose; see main.cpp qInstallMessageHandler).
          printf '[Paths]\nPlugins = PlugIns\nQml2Imports = Resources/qml\n' > "$APP/Contents/Resources/qt.conf"

          echo "Plugin dir contents:"
          ls "$APP/Contents/PlugIns/platforms/"

          # Copy any Qt frameworks macdeployqt missed (e.g. QtDBus, required by
          # libqcocoa) — quote paths, the bundle name contains spaces.
          echo "=== Copying Qt frameworks macdeployqt missed ==="
          find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 | \
          while IFS= read -r -d '' bin; do
            otool -L "$bin" 2>/dev/null | tail -n +2 | awk '{print $1}' | grep '^@rpath/Qt' | \
            while IFS= read -r dep; do
              fw="${dep#@rpath/}"; fw="${fw%%/*}"
              if [ ! -e "$APP/Contents/Frameworks/$fw" ] && [ -d "$QTPFX/lib/$fw" ]; then
                cp -R "$QTPFX/lib/$fw" "$APP/Contents/Frameworks/"
                echo "  copied $fw (needed by $(basename "$bin"))"
              fi
            done
          done

      # mcpelauncher-webview links Qt6, while mcpelauncher-ui-qt/msa-ui-qt link
      # Qt5 — both would fight over the same framework names (QtCore.framework
      # etc. are identically named across major versions) if merged into one
      # shared Contents/Frameworks. Deploy it as a private nested "app" under
      # Resources instead, built with Qt6's own macdeployqt so its Frameworks/
      # PlugIns/qt.conf stay entirely self-contained, then point a thin
      # wrapper script at it from Contents/MacOS (where xal_webview_qt.cpp's
      # findWebView() looks, per -DXAL_WEBVIEW_QT_PATH=.).
      - name: Bundle mcpelauncher-webview (isolated Qt6)
        run: |
          APP="output/Minecraft Bedrock Launcher.app"
          QT6PFX="${{ steps.qt.outputs.path6 }}"
          WV_SRC="$GITHUB_WORKSPACE/source/install/bin/mcpelauncher-webview"

          if [ ! -f "$WV_SRC" ]; then
            echo "mcpelauncher-webview was not built (Qt6 not found?) — Xbox Live sign-in will not work. Skipping."
            exit 0
          fi

          NEST="$APP/Contents/Resources/mcpelauncher/webview-qt6"
          FAKE="$RUNNER_TEMP/WebviewDeploy.app"
          mkdir -p "$FAKE/Contents/MacOS"
          cp "$WV_SRC" "$FAKE/Contents/MacOS/mcpelauncher-webview"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleExecutable</key><string>mcpelauncher-webview</string>' \
            '<key>CFBundleIdentifier</key><string>io.mrarm.mcpelauncher.webview</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '</dict></plist>' > "$FAKE/Contents/Info.plist"

          QMLDIR_ARGS=""
          [ -d "source/mcpelauncher/mcpelauncher-webview" ] && \
            QMLDIR_ARGS="-qmldir=source/mcpelauncher/mcpelauncher-webview"

          "$QT6PFX/bin/macdeployqt" "$FAKE" $QMLDIR_ARGS \
            && echo "Qt6 macdeployqt OK" \
            || echo "Qt6 macdeployqt failed, webview may not run"

          # Cocoa platform plugin isn't always pulled automatically.
          mkdir -p "$FAKE/Contents/PlugIns/platforms"
          [ -f "$FAKE/Contents/PlugIns/platforms/libqcocoa.dylib" ] || \
            cp "$QT6PFX/plugins/platforms/libqcocoa.dylib" "$FAKE/Contents/PlugIns/platforms/" 2>/dev/null || true

          mkdir -p "$(dirname "$NEST")"
          cp -R "$FAKE" "$NEST.app"
          chmod +x "$NEST.app/Contents/MacOS/mcpelauncher-webview"

          cat > "$APP/Contents/MacOS/mcpelauncher-webview" << 'WVEOF'
          #!/bin/bash
          # Thin wrapper: the real Qt6 webview binary lives isolated under Resources so
          # its Qt6 frameworks/qt.conf never collide with the app's Qt5 (see the
          # "Bundle mcpelauncher-webview" build step for why).
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/../Resources/mcpelauncher/webview-qt6.app/Contents/MacOS" && pwd)"
          exec "$DIR/mcpelauncher-webview" "$@"
          WVEOF
          # Strip the YAML block indent that had to be there for the heredoc
          # to parse as part of this `run: |` step.
          sed -i '' 's/^          //' "$APP/Contents/MacOS/mcpelauncher-webview"
          chmod +x "$APP/Contents/MacOS/mcpelauncher-webview"

          echo "=== webview-qt6.app contents ==="
          find "$NEST.app/Contents" -maxdepth 2 | sed 's/^/  /'

      # Rewrite build-machine dylib paths to bundle-relative ones. cmake links
      # absolute paths (e.g. .../ssl-out/lib/libcrypto.3.dylib) that macdeployqt
      # leaves untouched, so dyld fails at launch with no crash report.
      - name: Repair bundle dylib paths
        run: |
          bash fix_bundle.sh "output/Minecraft Bedrock Launcher.app" \
            "$GITHUB_WORKSPACE/ssl-artifacts" \
            "$(brew --prefix)/lib" \
            "$(brew --prefix)/opt"

      - name: Verify bundle is self-contained
        run: |
          APP="output/Minecraft Bedrock Launcher.app"
          echo "=== Absolute non-system deps (must be empty) ==="
          bad=0
          while IFS= read -r -d '' bin; do
            file -b "$bin" | grep -q Mach-O || continue
            refs=$(otool -L "$bin" 2>/dev/null | tail -n +2 | awk '{print $1}' \
                   | grep '^/' | grep -v '^/usr/lib' | grep -v '^/System' || true)
            if [ -n "$refs" ]; then
              echo "  $(basename "$bin"): $refs"
              bad=1
            fi
          done < <(find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) -print0)
          [ "$bad" -eq 0 ] && echo "  none — self-contained"

          # Actually launch the binary and confirm the QML root object loads.
          # String-matching the binary for "main.qml" is not reliable — Qt
          # stores qrc paths as UTF-16, so plain `strings` finds nothing even in
          # a working build; this smoke test is the only real signal. macOS
          # Actions runners have a window server available, so the real cocoa
          # platform plugin can be used directly.
          echo "=== Smoke test: launch and confirm it survives past QML load ==="
          cd "$APP/Contents/MacOS"
          ./mcpelauncher-ui-qt --verbose > /tmp/smoketest.log 2>&1 &
          SMOKE_PID=$!
          sleep 6
          if kill -0 $SMOKE_PID 2>/dev/null; then
            echo "  process alive after 6s — QML loaded OK"
            kill $SMOKE_PID 2>/dev/null || true
            wait $SMOKE_PID 2>/dev/null || true
          else
            wait $SMOKE_PID; code=$?
            echo "  process exited with code $code"
            echo "--- last 40 log lines ---"
            tail -40 /tmp/smoketest.log
            [ "$code" -eq 0 ] || { echo "FATAL: launcher exited during smoke test"; exit 1; }
          fi

      - name: Build DMG
        run: |
          mkdir -p output
          python3 build_dmg.py
          mv "output/Minecraft Bedrock Launcher.dmg" \
             "Minecraft_Bedrock_Launcher_GLES31_Intel_macOS_10.15_build${GITHUB_RUN_NUMBER}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: launcher-dmg-intel-gles31
          path: "*.dmg"

      - name: Create release
        if: inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "gles31-${{ github.run_number }}"
          name: "Minecraft Launcher GLES 3.1 (Intel) — build ${{ github.run_number }}"
          body: |
            Intel Mac (x86_64) build with GLES 3.1 support via Metal-backed ANGLE.
            Supports Minecraft Bedrock 1.21.60+ (including 1.26.x).

            Load your APK via: Launcher → Settings → Import APK
          files: "*.dmg"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
