name: Build Minecraft Launcher (GLES 3.1 / Intel x86_64)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release'
        type: boolean
        default: false

jobs:
  # ── 1. Build ANGLE x86_64 with Metal backend (GLES 3.1) ────────────────────
  build-angle:
    name: Build ANGLE x86_64 (Metal / GLES 3.1)
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - name: Cache ANGLE
        id: cache-angle
        uses: actions/cache@v4
        with:
          path: angle-out
          key: angle-gles31-x64-metal-v3

      - name: Install depot_tools
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Fetch ANGLE (minecraft-linux fork, metal-freeze branch)
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/minecraft-linux/angle.git -b metal-freeze angle-src
          cd angle-src
          python3 scripts/bootstrap.py
          gclient sync --no-history -j8

      - name: Build ANGLE x86_64
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: |
          mkdir -p angle-out
          OUT="$GITHUB_WORKSPACE/angle-out"
          cd angle-src
          python3 -c "
          args = [
            'target_cpu=\"x64\"',
            'is_debug=false',
            'mac_sdk_min=\"10.15\"',
            'mac_min_system_version=\"10.15\"',
            'mac_deployment_target=\"10.15\"',
            'angle_enable_metal=true',
            'angle_enable_swiftshader=false',
            'angle_enable_vulkan=false',
            'angle_enable_gl=false',
            'angle_enable_null=false',
          ]
          open('$OUT/args.gn', 'w').write('\n'.join(args))
          "
          gn gen "$OUT"
          autoninja -C "$OUT" libEGL libGLESv2

      - name: Verify GLES 3.1 symbols
        run: |
          ls -lh angle-out/libEGL.dylib angle-out/libGLESv2.dylib
          nm angle-out/libGLESv2.dylib | grep -q "glDispatchCompute" && echo "GLES 3.1 confirmed" || (echo "GLES 3.1 NOT confirmed"; exit 1)

      - name: Upload ANGLE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angle-x86_64-gles31
          path: |
            angle-out/libEGL.dylib
            angle-out/libGLESv2.dylib

  # ── 2. Build OpenSSL (needed by mcpelauncher) ───────────────────────────────
  build-openssl:
    name: Build OpenSSL x86_64
    runs-on: macos-15-intel
    steps:
      - name: Cache OpenSSL
        id: cache-ssl
        uses: actions/cache@v4
        with:
          path: ssl-out
          key: openssl-x64-macos-v1

      - name: Build OpenSSL
        if: steps.cache-ssl.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/openssl/openssl.git -b openssl-3.2
          mkdir -p ssl-out
          cd openssl
          ./config --prefix="$GITHUB_WORKSPACE/ssl-out"
          make -j8
          make install_sw -j8

      - name: Upload OpenSSL
        uses: actions/upload-artifact@v4
        with:
          name: openssl-x86_64
          path: ssl-out/

  # ── 3. Build mcpelauncher + UI ──────────────────────────────────────────────
  build-launcher:
    name: Build mcpelauncher (Intel x86_64)
    runs-on: macos-15-intel
    needs: [build-angle, build-openssl]
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Python deps
        run: pip3 install --break-system-packages jinja2 ds_store

      - name: Install brew deps
        run: |
          brew install cmake ninja automake autoconf libtool p7zip protobuf
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Download ANGLE
        uses: actions/download-artifact@v4
        with:
          name: angle-x86_64-gles31
          path: angle-artifacts

      - name: Download OpenSSL
        uses: actions/download-artifact@v4
        with:
          name: openssl-x86_64
          path: ssl-artifacts

      - name: Install Qt 5.15
        run: |
          # Download Qt 5.15.0 prebuilt for macOS x86_64
          QT_BASE_URL="http://download.qt.io/online/qtsdkrepository/mac_x64/desktop/qt5_5150/"
          QT_VERSION="5.15.0-0-202005140805"
          QT_PKG_PREFIX="qt.qt5.5150."
          QT_PKG_SUFFIX="clang_64"
          QT_PREBUILT="-MacOS-MacOS_10_13-Clang-MacOS-MacOS_10_13-X86_64"
          bash download_qt.sh
        env:
          QT_BASE_URL: "http://download.qt.io/online/qtsdkrepository/mac_x64/desktop/qt5_5150/"
          QT_VERSION_SHORT: "5.15.0"
          QT_VERSION: "5.15.0-0-202005140805"
          QT_PACKAGE_PREFIX: "qt.qt5.5150."
          QT_PACKAGE_SUFFIX: "clang_64"
          QT_PREBUILT_SUFFIX: "-MacOS-MacOS_10_13-Clang-MacOS-MacOS_10_13-X86_64"

      - name: Clone sources
        run: |
          MCPE_REF=$(cat mcpelauncher.commit)
          MSA_REF=$(cat msa.commit)
          MCPEUI_REF=$(cat mcpelauncher-ui.commit)

          git clone https://github.com/minecraft-linux/mcpelauncher-manifest.git source/mcpelauncher
          git -C source/mcpelauncher checkout "$MCPE_REF"
          git -C source/mcpelauncher submodule update --init --recursive

          git clone https://github.com/minecraft-linux/msa-manifest.git source/msa
          git -C source/msa checkout "$MSA_REF"
          git -C source/msa submodule update --init --recursive

          git clone https://github.com/minecraft-linux/mcpelauncher-ui-manifest.git source/mcpelauncher-ui
          git -C source/mcpelauncher-ui checkout "$MCPEUI_REF"
          git -C source/mcpelauncher-ui submodule update --init --recursive

          # Clone versionsdb
          VDBREF=$(cat versionsdb.txt)
          git clone https://github.com/minecraft-linux/mcpelauncher-versiondb.git source/versionsdb
          git -C source/versionsdb checkout "$VDBREF"

      # Remove the package-name whitelist gate on APK import. Upstream code:
      #   var packages = ["com.mojang.minecrafttrialpe", "com.mojang.minecraftedu"]
      #   if(!root.trialMode) { packages.push("com.mojang.minecraftpe") }
      # With trial mode ON, this list explicitly EXCLUDES com.mojang.minecraftpe
      # (the real retail package our APK has), producing "Trying to import a
      # forbidden apk" regardless of trial mode state. This is a package-name
      # steering check, not a security/compatibility check — the legitimate
      # validity check (presence of a working libminecraftpe.so for a supported
      # ABI) lives separately in apkextractiontask.cpp and is left untouched.
      # An empty allowedPackages list disables the whitelist entirely (see the
      # C++ side: `if (!m_allowedPackages.empty() && !contains(...))`).
      - name: Patch out APK package whitelist
        run: |
          QML="source/mcpelauncher-ui/mcpelauncher-ui-qt/qml/ApkImportHelper.qml"
          NEEDLE='if(!root.trialMode) {'
          COUNT=$(grep -c -F "$NEEDLE" "$QML")
          [ "$COUNT" -eq 1 ] || { echo "FATAL: expected 1 match for '$NEEDLE', found $COUNT — upstream QML changed"; exit 1; }
          # com.mojang.minecraftpe (the real retail package) is only added to
          # allowedPackages when trialMode is OFF — with trial mode on it stays
          # excluded, so "Import .apk" rejects a genuine Minecraft apk with
          # "Trying to import a forbidden apk" regardless of the trial toggle.
          # Force the branch to always run so the real package is always allowed.
          sed -i '' "s/$NEEDLE/if(true) {/" "$QML"
          grep -n "if(true) {" "$QML"

      # Adds: a "save downloaded .apk to a folder" setting (default OFF, matches
      # the existing keepApks toggle's default) with a custom-folder picker,
      # wired into the real Play/Download flow; clarifying x86_64-only text on
      # the Import .apk button and dialog. Importing an incompatible apk was
      # already handled gracefully upstream (apkextractiontask.cpp throws
      # std::runtime_error, caught and surfaced via a QML MessageDialog — no
      # crash), so no fix was needed there.
      - name: Patch in custom apk-save-folder setting + clearer Import UI
        run: |
          BASE="source/mcpelauncher-ui/mcpelauncher-ui-qt"
          python3 - << 'PYEOF'
          BASE = "source/mcpelauncher-ui/mcpelauncher-ui-qt"

          def patch(path, replacements):
              full = f"{BASE}/{path}"
              with open(full) as f:
                  content = f.read()
              for old, new in replacements:
                  assert old in content, f"pattern not found in {path}: {old[:60]!r}"
                  content = content.replace(old, new)
              with open(full, "w") as f:
                  f.write(content)
              print(f"patched {path}")

          patch("googleapkdownloadtask.h", [
              ("    Q_PROPERTY(bool keepApks READ keepApks WRITE setKeepApks)\n"
               "    Q_PROPERTY(bool dryrun MEMBER m_dryrun)",
               "    Q_PROPERTY(bool keepApks READ keepApks WRITE setKeepApks)\n"
               "    Q_PROPERTY(QString apksDir READ apksDir WRITE setApksDir)\n"
               "    Q_PROPERTY(bool dryrun MEMBER m_dryrun)"),
              ("    bool m_keepApks = false;\n    bool m_dryrun = false;",
               "    bool m_keepApks = false;\n    QString m_apksDir;\n    bool m_dryrun = false;"),
              ("    bool keepApks() const { return m_keepApks; }\n"
               "    void setKeepApks(bool keepApks) { m_keepApks = keepApks; }",
               "    bool keepApks() const { return m_keepApks; }\n"
               "    void setKeepApks(bool keepApks) { m_keepApks = keepApks; }\n\n"
               "    QString apksDir() const { return m_apksDir; }\n"
               "    void setApksDir(QString apksDir) { m_apksDir = apksDir; }"),
          ])

          patch("googleapkdownloadtask.cpp", [
              ('    auto apksdir = QDir(QStandardPaths::writableLocation(QStandardPaths::GenericDataLocation)).filePath("mcpelauncher/apks");\n'
               '    QDir().mkpath(apksdir);',
               '    auto apksdir = m_apksDir.isEmpty()\n'
               '        ? QDir(QStandardPaths::writableLocation(QStandardPaths::GenericDataLocation)).filePath("mcpelauncher/apks")\n'
               '        : m_apksDir;\n'
               '    QDir().mkpath(apksdir);'),
          ])

          patch("launchersettings.h", [
              ("    Q_PROPERTY(bool keepApks READ keepApks WRITE setKeepApks NOTIFY settingsChanged)",
               "    Q_PROPERTY(bool keepApks READ keepApks WRITE setKeepApks NOTIFY settingsChanged)\n"
               "    Q_PROPERTY(QString apkSaveDir READ apkSaveDir WRITE setApkSaveDir NOTIFY settingsChanged)"),
              ('    bool keepApks() const { return settings.value("keepApks", false).toBool(); }\n'
               '    void setKeepApks(bool value) { settings.setValue("keepApks", value); emit settingsChanged(); }',
               '    bool keepApks() const { return settings.value("keepApks", false).toBool(); }\n'
               '    void setKeepApks(bool value) { settings.setValue("keepApks", value); emit settingsChanged(); }\n\n'
               '    QString apkSaveDir() const { return settings.value("apkSaveDir", "").toString(); }\n'
               '    void setApkSaveDir(QString value) { settings.setValue("apkSaveDir", value); emit settingsChanged(); }'),
          ])

          patch("qml/LauncherSettingsGeneral.qml", [
              ('import QtQuick 2.9\nimport QtQuick.Layouts 1.2\nimport "ThemedControls"',
               'import QtQuick 2.9\nimport QtQuick.Layouts 1.2\nimport QtQuick.Dialogs 1.2\nimport "ThemedControls"'),
              ('    MCheckBox {\n'
               '        text: qsTr("Keep Apks in <GameData>/apks")\n'
               '        Component.onCompleted: checked = launcherSettings.keepApks\n'
               '        onCheckedChanged: launcherSettings.keepApks = checked\n'
               '    }',
               '    MCheckBox {\n'
               '        id: keepApksCheckbox\n'
               '        text: qsTr("Save downloaded .apk to a folder (x86_64, playable via Import .apk)")\n'
               '        Component.onCompleted: checked = launcherSettings.keepApks\n'
               '        onCheckedChanged: launcherSettings.keepApks = checked\n'
               '    }\n\n'
               '    RowLayout {\n'
               '        visible: keepApksCheckbox.checked\n'
               '        Layout.fillWidth: true\n\n'
               '        MTextField {\n'
               '            id: apkSaveDirField\n'
               '            Layout.fillWidth: true\n'
               '            readOnly: true\n'
               '            text: launcherSettings.apkSaveDir !== "" ? launcherSettings.apkSaveDir : qsTr("(default: <GameData>/apks)")\n'
               '        }\n\n'
               '        MButton {\n'
               '            text: qsTr("Choose Folder")\n'
               '            onClicked: apkSaveDirDialog.open()\n'
               '        }\n\n'
               '        MButton {\n'
               '            text: qsTr("Reset")\n'
               '            visible: launcherSettings.apkSaveDir !== ""\n'
               '            onClicked: launcherSettings.apkSaveDir = ""\n'
               '        }\n'
               '    }\n\n'
               '    FileDialog {\n'
               '        id: apkSaveDirDialog\n'
               '        title: qsTr("Choose a folder to save downloaded .apk files")\n'
               '        selectFolder: true\n'
               '        onAccepted: launcherSettings.apkSaveDir = fileUrl.toString().replace("file://", "")\n'
               '    }'),
          ])

          patch("qml/LauncherMain.qml", [
              ("        keepApks: launcherSettings.downloadOnly || launcherSettings.keepApks",
               "        keepApks: launcherSettings.downloadOnly || launcherSettings.keepApks\n"
               "        apksDir: launcherSettings.apkSaveDir"),
          ])

          patch("qml/LauncherSettingsVersions.qml", [
              ('        MButton {\n'
               '            Layout.fillWidth: true\n'
               '            text: (googleLoginHelper.account !== null && playVerChannel.hasVerifiedLicense || launcherSettings.trialMode || !LAUNCHER_ENABLE_GOOGLE_PLAY_LICENCE_CHECK) ? launcherSettings.trialMode ?  qsTr("Import trial .apk") : qsTr("Import .apk") : "<s>" + qsTr("Import .apk") + "</s>"\n'
               '            onClicked: apkImportWindow.pickFile()\n'
               '            enabled: (googleLoginHelper.account !== null && playVerChannel.hasVerifiedLicense || launcherSettings.trialMode || !LAUNCHER_ENABLE_GOOGLE_PLAY_LICENCE_CHECK)\n'
               '        }',
               '        MButton {\n'
               '            Layout.fillWidth: true\n'
               '            text: (googleLoginHelper.account !== null && playVerChannel.hasVerifiedLicense || launcherSettings.trialMode || !LAUNCHER_ENABLE_GOOGLE_PLAY_LICENCE_CHECK) ? launcherSettings.trialMode ?  qsTr("Import trial .apk") : qsTr("Import .apk (x86_64 only)") : "<s>" + qsTr("Import .apk") + "</s>"\n'
               '            onClicked: apkImportWindow.pickFile()\n'
               '            enabled: (googleLoginHelper.account !== null && playVerChannel.hasVerifiedLicense || launcherSettings.trialMode || !LAUNCHER_ENABLE_GOOGLE_PLAY_LICENCE_CHECK)\n'
               '        }\n\n'
               '        MText {\n'
               '            Layout.fillWidth: true\n'
               '            wrapMode: Text.WordWrap\n'
               '            font.pointSize: 8\n'
               '            color: "#aaa"\n'
               '            text: qsTr("Only x86_64 Minecraft apks run on this launcher. An apk extracted from a phone or most download mirrors is arm64 and will be rejected. Use \\"Sign in with Google\\" + \\"Download and play\\" to fetch a compatible copy, or enable \\"Save downloaded .apk to a folder\\" in Settings to keep a reusable x86_64 file for Import.")\n'
               '        }'),
          ])

          patch("qml/ApkImportWindow.qml", [
              ('title: "Minecraft .apk import"',
               'title: "Minecraft .apk import (must be x86_64)"'),
          ])
          PYEOF

      - name: Build libzip
        run: |
          git clone https://github.com/nih-at/libzip libzip
          git -C libzip checkout v1.9.2
          cmake libzip -B libzip-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=4.0 \
            -DBUILD_TOOLS=OFF -DBUILD_REGRESS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOC=OFF \
            -DENABLE_BZIP2=OFF -DENABLE_LZMA=OFF -DENABLE_ZSTD=OFF \
            -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF \
            -DENABLE_OPENSSL=OFF -DENABLE_WINDOWS_CRYPTO=OFF -DENABLE_FDOPEN=OFF
          cmake --build libzip-build --parallel
          sudo cmake --build libzip-build --target install --parallel

      - name: Prepare base app skeleton
        run: |
          mkdir -p base-app/Contents/Frameworks
          cp angle-artifacts/libEGL.dylib base-app/Contents/Frameworks/
          cp angle-artifacts/libGLESv2.dylib base-app/Contents/Frameworks/
          cp ssl-artifacts/lib/libssl.dylib base-app/Contents/Frameworks/ 2>/dev/null || true
          cp ssl-artifacts/lib/libcrypto.dylib base-app/Contents/Frameworks/ 2>/dev/null || true

      - name: Find Qt path
        id: qt
        run: |
          # download_qt.sh extracts to qt/<version>/clang_64
          QT_PATH=$(find qt -name "Qt5Config.cmake" 2>/dev/null | head -1 | xargs -I{} dirname {} | xargs -I{} dirname {})
          [ -z "$QT_PATH" ] && QT_PATH=$(ls -d qt/5.15.0/clang_64 2>/dev/null || ls -d qt/*/clang_64 2>/dev/null | head -1)
          echo "path=$QT_PATH" >> $GITHUB_OUTPUT
          echo "Detected Qt path: $QT_PATH"
          ls "$QT_PATH/lib/cmake/Qt5/" 2>/dev/null | head -3

      - name: Build mcpelauncher (cmake direct)
        run: |
          SSL="$GITHUB_WORKSPACE/ssl-artifacts"
          INSTALL="$GITHUB_WORKSPACE/source/install"
          QT="$GITHUB_WORKSPACE/${{ steps.qt.outputs.path }}"
          mkdir -p "$INSTALL" source/build/mcpelauncher

          cmake source/mcpelauncher \
            -B source/build/mcpelauncher \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_PREFIX_PATH="$QT" \
            -DQt5_DIR="$QT/lib/cmake/Qt5" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DMSA_DAEMON_PATH=. \
            -DENABLE_DEV_PATHS=OFF \
            -DBUILD_FAKE_JNI_TESTS=OFF \
            -DBUILD_FAKE_JNI_EXAMPLES=OFF \
            -DBUILD_WEBVIEW=OFF \
            -DENABLE_QT_ERROR_UI=OFF \
            -DXAL_WEBVIEW_QT_PATH=. \
            -DJNI_USE_JNIVM=ON \
            -DUSE_OWN_CURL=OFF \
            -DOPENSSL_ROOT_DIR="$SSL" \
            -DOPENSSL_CRYPTO_LIBRARY="$SSL/lib/libcrypto.dylib" \
            -DCMAKE_CXX_FLAGS="-DNDEBUG -D_LIBCPP_DISABLE_AVAILABILITY=1 -I$SSL/include -L$SSL/lib"
          cmake --build source/build/mcpelauncher --parallel --target install

      - name: Build msa
        run: |
          SSL="$GITHUB_WORKSPACE/ssl-artifacts"
          INSTALL="$GITHUB_WORKSPACE/source/install"
          QT="$GITHUB_WORKSPACE/${{ steps.qt.outputs.path }}"
          mkdir -p source/build/msa

          cmake source/msa \
            -B source/build/msa \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_PREFIX_PATH="$QT" \
            -DQt5_DIR="$QT/lib/cmake/Qt5" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_MSA_QT_UI=ON \
            -DMSA_UI_PATH_DEV=OFF \
            -DCMAKE_CXX_FLAGS="-DNDEBUG -D_LIBCPP_DISABLE_AVAILABILITY=1"
          cmake --build source/build/msa --parallel --target install

      - name: Build mcpelauncher-ui
        run: |
          SSL="$GITHUB_WORKSPACE/ssl-artifacts"
          INSTALL="$GITHUB_WORKSPACE/source/install"
          QT="$GITHUB_WORKSPACE/${{ steps.qt.outputs.path }}"
          VDBREF=$(cat versionsdb.txt)
          mkdir -p source/build/mcpelauncher-ui

          cmake source/mcpelauncher-ui \
            -B source/build/mcpelauncher-ui \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_PREFIX_PATH="$QT" \
            -DQt5_DIR="$QT/lib/cmake/Qt5" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DGAME_LAUNCHER_PATH=. \
            -DQt5QuickCompiler_FOUND=OFF \
            -DLAUNCHER_ENABLE_GOOGLE_PLAY_LICENCE_CHECK=OFF \
            -DLAUNCHER_DISABLE_DEV_MODE=ON \
            -DLAUNCHER_VERSION_NAME="v1.x-gles31-$GITHUB_RUN_NUMBER" \
            -DLAUNCHER_VERSION_CODE="$GITHUB_RUN_NUMBER" \
            -DLAUNCHER_VERSIONDB_PATH="$GITHUB_WORKSPACE/source/versionsdb" \
            -DLAUNCHER_VERSIONDB_URL="https://raw.githubusercontent.com/minecraft-linux/mcpelauncher-versiondb/$VDBREF" \
            -DOPENSSL_ROOT_DIR="$SSL" \
            -DOPENSSL_CRYPTO_LIBRARY="$SSL/lib/libcrypto.dylib" \
            -DCMAKE_CXX_FLAGS="-DNDEBUG -D_LIBCPP_DISABLE_AVAILABILITY=1 -I$SSL/include -L$SSL/lib"
          cmake --build source/build/mcpelauncher-ui --parallel --target install

      - name: Assemble .app bundle
        run: |
          INSTALL="$GITHUB_WORKSPACE/source/install"
          QT="${{ steps.qt.outputs.path }}"
          APP="output/Minecraft Bedrock Launcher.app"
          mkdir -p "$APP/Contents/"{MacOS,Frameworks,Resources}

          # Copy installed bins
          cp "$INSTALL/bin/"* "$APP/Contents/MacOS/" 2>/dev/null || true
          cp -R "$INSTALL/share/"* "$APP/Contents/Resources/" 2>/dev/null || true

          # Copy ANGLE + OpenSSL into Frameworks.
          # Copy every ssl dylib including versioned sonames (libcrypto.3.dylib):
          # binaries link the versioned name, so the bare name alone is not enough.
          cp angle-artifacts/libEGL.dylib "$APP/Contents/Frameworks/"
          cp angle-artifacts/libGLESv2.dylib "$APP/Contents/Frameworks/"
          cp -L ssl-artifacts/lib/*.dylib "$APP/Contents/Frameworks/" 2>/dev/null || true

          # Write Info.plist BEFORE macdeployqt: without CFBundleExecutable it
          # reports "Could not find bundle binary" and skips rpath rewriting on
          # the main executable, producing a bundle that dies silently at launch.
          PLIST="$APP/Contents/Info.plist"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' > "$PLIST"
          printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> "$PLIST"
          printf '%s\n' '<plist version="1.0"><dict>' >> "$PLIST"
          printf '%s\n' '  <key>CFBundleIdentifier</key><string>io.mrarm.mcpelauncher.ui</string>' >> "$PLIST"
          printf '%s\n' '  <key>CFBundleExecutable</key><string>mcpelauncher-ui-qt</string>' >> "$PLIST"
          printf '%s\n' '  <key>CFBundlePackageType</key><string>APPL</string>' >> "$PLIST"
          printf '%s\n' '  <key>CFBundleName</key><string>Minecraft Bedrock Launcher</string>' >> "$PLIST"
          printf '%s\n' '  <key>CFBundleIconFile</key><string>minecraft</string>' >> "$PLIST"
          printf '  <key>CFBundleVersion</key><string>1.0.%s</string>\n' "$GITHUB_RUN_NUMBER" >> "$PLIST"
          printf '%s\n' '  <key>LSMinimumSystemVersion</key><string>10.15</string>' >> "$PLIST"
          printf '%s\n' '  <key>NSHighResolutionCapable</key><true/>' >> "$PLIST"
          # QtWebEngine (Chromium) probes these permissions during the Google
          # OAuth login flow even when unused. Without a usage description,
          # macOS TCC kills the process outright with no catchable exception —
          # confirmed via crash report: "app crashed because it attempted to
          # access privacy-sensitive data without a usage description ...
          # NSBluetoothAlwaysUsageDescription". Add the full set Chromium is
          # known to probe so future TCC checks don't reintroduce this.
          printf '%s\n' '  <key>NSBluetoothAlwaysUsageDescription</key><string>Not used. Required by the embedded browser engine.</string>' >> "$PLIST"
          printf '%s\n' '  <key>NSCameraUsageDescription</key><string>Not used. Required by the embedded browser engine.</string>' >> "$PLIST"
          printf '%s\n' '  <key>NSMicrophoneUsageDescription</key><string>Not used. Required by the embedded browser engine.</string>' >> "$PLIST"
          printf '%s\n' '  <key>NSLocationWhenInUseUsageDescription</key><string>Not used. Required by the embedded browser engine.</string>' >> "$PLIST"
          printf '%s\n' '</dict></plist>' >> "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST"

          # Locate Qt prefix (where download_qt.sh installed it)
          QTPFX="$GITHUB_WORKSPACE/$(find qt -name "Qt5Config.cmake" 2>/dev/null | head -1 | sed 's|/lib/cmake/Qt5/Qt5Config.cmake||')"
          echo "Qt prefix: $QTPFX"

          # Run macdeployqt — copies frameworks + QML + plugins
          QTBIN="$QTPFX/bin/macdeployqt"
          if [ -x "$QTBIN" ]; then
            "$QTBIN" "$APP" \
              -qmldir=source/mcpelauncher-ui/mcpelauncher-ui-qt \
              -executable="$APP/Contents/MacOS/mcpelauncher-ui-qt" \
              -executable="$APP/Contents/MacOS/msa-ui-qt" && echo "macdeployqt OK" || echo "macdeployqt failed, continuing"
          else
            echo "macdeployqt not found at $QTBIN"
          fi

          # Always manually copy the cocoa platform plugin — Qt will abort() without it
          mkdir -p "$APP/Contents/PlugIns/platforms"
          cp "$QTPFX/plugins/platforms/libqcocoa.dylib" "$APP/Contents/PlugIns/platforms/"
          echo "Copied libqcocoa.dylib"

          # Copy other essential plugins
          for plugin_dir in imageformats iconengines; do
            [ -d "$QTPFX/plugins/$plugin_dir" ] && \
              mkdir -p "$APP/Contents/PlugIns/$plugin_dir" && \
              cp "$QTPFX/plugins/$plugin_dir/"*.dylib "$APP/Contents/PlugIns/$plugin_dir/" 2>/dev/null || true
          done

          # qt.conf — tells Qt where plugins AND QML modules live.
          # Without Qml2Imports, QQmlApplicationEngine cannot find QtQuick.Window/
          # Controls/Dialogs even though the plugin .dylibs are on disk — it fails
          # with "module ... is not installed" and engine.load() returns no root
          # object, so main() returns -1 silently (Qt's own error output is
          # suppressed unless launched with --verbose; see main.cpp qInstallMessageHandler).
          printf '[Paths]\nPlugins = PlugIns\nQml2Imports = Resources/qml\n' > "$APP/Contents/Resources/qt.conf"

          echo "Plugin dir contents:"
          ls "$APP/Contents/PlugIns/platforms/"

          # Copy any Qt frameworks macdeployqt missed (e.g. QtDBus, required by
          # libqcocoa) — quote paths, the bundle name contains spaces.
          echo "=== Copying Qt frameworks macdeployqt missed ==="
          find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 | \
          while IFS= read -r -d '' bin; do
            otool -L "$bin" 2>/dev/null | tail -n +2 | awk '{print $1}' | grep '^@rpath/Qt' | \
            while IFS= read -r dep; do
              fw="${dep#@rpath/}"; fw="${fw%%/*}"
              if [ ! -e "$APP/Contents/Frameworks/$fw" ] && [ -d "$QTPFX/lib/$fw" ]; then
                cp -R "$QTPFX/lib/$fw" "$APP/Contents/Frameworks/"
                echo "  copied $fw (needed by $(basename "$bin"))"
              fi
            done
          done

      # Rewrite build-machine dylib paths to bundle-relative ones. cmake links
      # absolute paths (e.g. .../ssl-out/lib/libcrypto.3.dylib) that macdeployqt
      # leaves untouched, so dyld fails at launch with no crash report.
      - name: Repair bundle dylib paths
        run: |
          bash fix_bundle.sh "output/Minecraft Bedrock Launcher.app" \
            "$GITHUB_WORKSPACE/ssl-artifacts" \
            "$(brew --prefix)/lib" \
            "$(brew --prefix)/opt"

      - name: Verify bundle is self-contained
        run: |
          APP="output/Minecraft Bedrock Launcher.app"
          echo "=== Absolute non-system deps (must be empty) ==="
          bad=0
          while IFS= read -r -d '' bin; do
            file -b "$bin" | grep -q Mach-O || continue
            refs=$(otool -L "$bin" 2>/dev/null | tail -n +2 | awk '{print $1}' \
                   | grep '^/' | grep -v '^/usr/lib' | grep -v '^/System' || true)
            if [ -n "$refs" ]; then
              echo "  $(basename "$bin"): $refs"
              bad=1
            fi
          done < <(find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) -print0)
          [ "$bad" -eq 0 ] && echo "  none — self-contained"

          # Actually launch the binary and confirm the QML root object loads.
          # String-matching the binary for "main.qml" is not reliable — Qt
          # stores qrc paths as UTF-16, so plain `strings` finds nothing even in
          # a working build; this smoke test is the only real signal. macOS
          # Actions runners have a window server available, so the real cocoa
          # platform plugin can be used directly.
          echo "=== Smoke test: launch and confirm it survives past QML load ==="
          cd "$APP/Contents/MacOS"
          ./mcpelauncher-ui-qt --verbose > /tmp/smoketest.log 2>&1 &
          SMOKE_PID=$!
          sleep 6
          if kill -0 $SMOKE_PID 2>/dev/null; then
            echo "  process alive after 6s — QML loaded OK"
            kill $SMOKE_PID 2>/dev/null || true
            wait $SMOKE_PID 2>/dev/null || true
          else
            wait $SMOKE_PID; code=$?
            echo "  process exited with code $code"
            echo "--- last 40 log lines ---"
            tail -40 /tmp/smoketest.log
            [ "$code" -eq 0 ] || { echo "FATAL: launcher exited during smoke test"; exit 1; }
          fi

      - name: Build DMG
        run: |
          mkdir -p output
          python3 build_dmg.py
          mv "output/Minecraft Bedrock Launcher.dmg" \
             "Minecraft_Bedrock_Launcher_GLES31_Intel_macOS_10.15_build${GITHUB_RUN_NUMBER}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: launcher-dmg-intel-gles31
          path: "*.dmg"

      - name: Create release
        if: inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "gles31-${{ github.run_number }}"
          name: "Minecraft Launcher GLES 3.1 (Intel) — build ${{ github.run_number }}"
          body: |
            Intel Mac (x86_64) build with GLES 3.1 support via Metal-backed ANGLE.
            Supports Minecraft Bedrock 1.21.60+ (including 1.26.x).

            Load your APK via: Launcher → Settings → Import APK
          files: "*.dmg"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
